<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bağlantı yok</title>
<style>
:root{--bg:#F3EBDD;--ink:#3B2A1E;--mut:#7A6555;--acc:#7A4A2A;--accink:#FFF8EE}
@media (prefers-color-scheme:dark){:root{--bg:#1E1712;--ink:#F1E6D6;--mut:#B5A28E;--acc:#D9A877;--accink:#24180E}}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:17px/1.45 -apple-system,Roboto,sans-serif}
main{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;box-sizing:border-box}
h1{font-size:22px;margin:0 0 8px;color:var(--acc)}p{margin:0 0 20px;color:var(--mut);max-width:320px}
button{font:inherit;font-weight:650;border:0;border-radius:99px;padding:12px 28px;background:var(--acc);color:var(--accink)}
</style></head>
<body><main><h1>İnternet bağlantısı yok</h1>
<p>Cep Atölyesi açılamadı. Bağlantınızı kontrol edip tekrar deneyin. Kayıtlarınız telefonda duruyor, silinmedi.</p>
<button onclick="location.href='https://ulgen00.github.io/Tamir-takip/'">Tekrar dene</button></main></body></html>
