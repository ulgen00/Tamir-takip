<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tamir Defteri</title>
<style>
:root{--bg:#F3EBDD;--surf:#FBF6EC;--ink:#3B2A1E;--mut:#7A6555;--line:#E0D3BF;--acc:#7A4A2A;--accink:#FFF8EE;--in:#3F7A3A;--out:#A8392B;
--c0:#8A5A00;--b0:#F4E2C0;--c1:#7A4A2A;--b1:#EBDCC8;--c2:#3F7A3A;--b2:#DDEBD3;--c3:#7A6555;--b3:#E8DFD2;--bo:#F6DCD7;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1E1712;--surf:#2A211A;--ink:#F1E6D6;--mut:#B5A28E;--line:#3D3127;--acc:#D9A877;--accink:#24180E;--in:#8FCB86;--out:#F09080;
--c0:#F0C36B;--b0:#3A2C12;--c1:#D9A877;--b1:#3D2C1C;--c2:#8FCB86;--b2:#22351F;--c3:#B5A28E;--b3:#332A22;--bo:#3D1F1B;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1E1712;--surf:#2A211A;--ink:#F1E6D6;--mut:#B5A28E;--line:#3D3127;--acc:#D9A877;--accink:#24180E;--in:#8FCB86;--out:#F09080;
--c0:#F0C36B;--b0:#3A2C12;--c1:#D9A877;--b1:#3D2C1C;--c2:#8FCB86;--b2:#22351F;--c3:#B5A28E;--b3:#332A22;--bo:#3D1F1B;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
main{max-width:640px;margin:0 auto;padding:12px 14px 96px}
h1{font-size:22px;margin:6px 0 12px;letter-spacing:-.3px}
.row{display:flex;gap:8px;align-items:center}.sp{justify-content:space-between}
.card{background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px}
.item{display:block;width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer}
.mut{color:var(--mut);font-size:14px}.b{font-weight:650}
.chip{display:inline-block;font-size:13px;font-weight:600;padding:2px 9px;border-radius:99px}
.s0{color:var(--c0);background:var(--b0)}.s1{color:var(--c1);background:var(--b1)}.s2{color:var(--c2);background:var(--b2)}.s3{color:var(--c3);background:var(--b3)}.s4{color:var(--out);background:var(--bo)}
.in{color:var(--in)}.out{color:var(--out)}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px}
.tabs button,.btn{font:inherit;border:1px solid var(--line);background:var(--surf);color:var(--ink);border-radius:99px;padding:8px 14px;min-height:44px;cursor:pointer;white-space:nowrap}
.tabs button.on{background:var(--acc);color:var(--accink);border-color:var(--acc)}
.btn.p{background:var(--acc);color:var(--accink);border-color:var(--acc);font-weight:650}
.btn.d{color:var(--out)}
.fab{position:fixed;right:16px;bottom:calc(20px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;border:0;background:var(--acc);color:var(--accink);font-size:30px;line-height:1;cursor:pointer;z-index:6;box-shadow:0 3px 10px rgba(0,0,0,.25)}
.sheetbg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92%;overflow:auto;border-radius:16px 16px 0 0;padding:16px 14px calc(16px + env(safe-area-inset-bottom,0px))}
/* Ekran açılırken alttan yukarı yumuşak geliş */
@keyframes sheetIn{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.sheetbg{animation:fadeIn .4s ease}
.sheet[role="dialog"]{animation:sheetIn .6s cubic-bezier(.22,.9,.3,1)}
@media (prefers-reduced-motion:reduce){.sheetbg,.sheet[role="dialog"]{animation:none}}
.sheet::before{content:"";display:block;width:40px;height:5px;border-radius:3px;background:var(--line);margin:-6px auto 6px}
.sheetx{position:sticky;top:0;float:right;z-index:2;margin:-4px -2px 0 8px;width:44px;height:44px;padding:0;border-radius:50%;border:1px solid var(--line);background:var(--surf);color:var(--ink);font-size:28px;line-height:1;display:grid;place-items:center;cursor:pointer}
.req{color:var(--out)}
label{display:block;font-size:14px;color:var(--mut);margin:10px 0 4px}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--surf);border:1px solid var(--line);border-radius:10px;padding:11px;min-height:46px}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.big{font-size:26px;font-weight:700;letter-spacing:-.5px}
.empty{text-align:center;color:var(--mut);padding:32px 12px}
.scan{position:fixed;inset:0;background:#000;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px}
.scan video{width:100%;max-height:65%;object-fit:cover;border-radius:12px}
.scanhint{color:#fff;text-align:center}
a{color:var(--acc)}
.top{max-width:640px;margin:0 auto;padding:12px 14px 0;display:flex;align-items:center;gap:12px}
.brand{font-weight:700;font-size:23px;letter-spacing:.3px;color:var(--acc)}
.menubtn{flex:none;width:44px;height:44px;padding:0;border-radius:12px;border:1px solid var(--line);background:var(--surf);color:var(--ink);display:grid;place-items:center;cursor:pointer}
.drawerbg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:15;opacity:0;pointer-events:none;transition:opacity .2s}
.drawerbg.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;bottom:0;left:0;width:min(290px,82vw);background:var(--surf);border-right:1px solid var(--line);z-index:16;overflow-y:auto;
padding:calc(14px + env(safe-area-inset-top,0px)) 12px calc(16px + env(safe-area-inset-bottom,0px)) calc(12px + env(safe-area-inset-left,0px));
display:flex;flex-direction:column;gap:4px;transform:translateX(-100%);visibility:hidden;transition:transform .25s ease,visibility .25s}
.drawer.open{transform:none;visibility:visible}
.dhead{display:flex;align-items:center;justify-content:space-between;padding:0 0 10px 8px;font-weight:700;font-size:20px;color:var(--acc)}
.drawer .dhead button{flex:none;width:44px;min-height:44px;padding:0;justify-content:center;font-size:26px;line-height:1;color:var(--mut)}
.drawer button{font:inherit;text-align:left;background:none;border:0;color:var(--ink);padding:12px;border-radius:10px;min-height:50px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px}
.drawer button.on{background:var(--b1);color:var(--c1);font-weight:700}
.themesw{margin-left:auto;flex:none;display:flex;gap:2px;padding:3px;border:1px solid var(--line);background:var(--surf);border-radius:99px}
.themesw button{width:40px;height:38px;padding:0;border:0;border-radius:99px;background:none;color:var(--mut);display:grid;place-items:center;cursor:pointer}
.themesw button[aria-pressed="true"]{background:var(--acc);color:var(--accink)}
@media (prefers-reduced-motion:reduce){.drawer,.drawerbg{transition:none}}
</style>
</head>
<body>
<header class="top"><button class="menubtn" id="menuBtn" data-menu aria-label="Seçenekler" aria-expanded="false" aria-controls="drawer"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" fill="none"/></svg></button><span class="brand">Cep Atölyesi</span><div class="themesw" role="group" aria-label="Tema"><button data-themeset="light" aria-label="Açık tema" title="Açık tema"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.2" fill="currentColor" stroke="none"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/></svg></button><button data-themeset="dark" aria-label="Koyu tema" title="Koyu tema"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 14.6A8.5 8.5 0 0 1 9.4 3.5a8.5 8.5 0 1 0 11.1 11.1z" fill="currentColor"/></svg></button></div></header>
<main id="app"></main>
<button class="fab" id="fab" aria-label="Yeni kayıt ekle">+</button>
<div class="drawerbg" id="drawerbg"></div>
<aside class="drawer" id="drawer" aria-label="Seçenekler" aria-hidden="true"><div class="dhead"><span>Seçenekler</span><button data-menuclose aria-label="Menüyü kapat">×</button></div><div id="drawerNav" style="display:flex;flex-direction:column;gap:4px"></div></aside>
<script>
const ST=["Bekliyor","Tamirde","Hazır","Teslim edildi"];
const CAT_IN=["Tamir","Aksesuar satışı","Diğer gelir"],CAT_OUT=["Parça","Kira","Fatura","Maaş","Diğer gider"];
let db={repairs:[],tx:[]},view="repairs",flt="all",month=new Date().toISOString().slice(0,7);
try{const s=localStorage.getItem("tamir-defteri-v1");if(s)db=JSON.parse(s)}catch(e){}
const save=()=>{try{localStorage.setItem("tamir-defteri-v1",JSON.stringify(db))}catch(e){}};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const today=()=>new Date().toISOString().slice(0,10);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const money=n=>(Number(n)||0).toLocaleString("tr-TR",{maximumFractionDigits:2})+" ₺";
const dfmt=d=>d?d.split("-").reverse().join("."):"";
const $=s=>document.querySelector(s);
// Sayfa içi onay kutusu (tarayıcının confirm/alert pencereleri bazı ortamlarda çalışmıyor)
function ask(msg,only){return new Promise(res=>{const d=document.createElement("div");d.className="sheetbg";d.style.zIndex=40;d.style.alignItems="center";
  d.innerHTML=`<div class="sheet" role="alertdialog" aria-modal="true" style="border-radius:16px;margin:16px"><p style="margin-top:0">${esc(msg)}</p><div class="row"><button class="btn p" data-ok>${only?"Tamam":"Evet"}</button>${only?"":'<button class="btn" data-no>Vazgeç</button>'}</div></div>`;
  d.querySelector("[data-ok]").onclick=e=>{e.stopPropagation();d.remove();res(true)};const n=d.querySelector("[data-no]");if(n)n.onclick=e=>{e.stopPropagation();d.remove();res(false)};
  document.body.appendChild(d);d.querySelector("[data-ok]").focus()})}
const say=m=>ask(m,true);

function render(){
  $("#drawerNav").innerHTML=[["repairs","Cihazlar"],["cash","Kasa"],["sum","Özet"],["imei","IMEI Sorgula"]].map(([k,t])=>`<button class="${view==k?"on":""}" data-v="${k}" ${view==k?'aria-current="page"':""}>${t}</button>`).join(""); 
  $("#fab").style.display=view=="sum"||view=="imei"?"none":"block";
  $("#app").innerHTML=view=="repairs"?vRepairs():view=="imei"?vImei():view=="cash"?vCash():vSum();
}
function vRepairs(){
  const counts=ST.map((_,i)=>db.repairs.filter(r=>r.st==i).length);
  let list=db.repairs.filter(r=>flt=="all"||r.st==flt).sort((a,b)=>b.date.localeCompare(a.date));
  return `<h1>Tamire gelen cihazlar</h1>
  <div class="tabs"><button class="${flt=="all"?"on":""}" data-f="all">Hepsi ${db.repairs.length}</button>${ST.map((s,i)=>`<button class="${flt==i?"on":""}" data-f="${i}">${s} ${counts[i]}</button>`).join("")}</div>
  ${list.length?list.map(r=>`<button class="card item" data-r="${r.id}"><div class="row sp"><span class="b">${esc(r.model)}</span><span class="chip s${r.st}">${ST[r.st]}</span></div>
  <div class="mut">${esc(r.name)}${r.phone?" · "+esc(fmtPhone(r.phone)):""}</div><div class="mut">${esc(r.issue)}</div>${r.imei?`<div class="mut">IMEI ${esc(r.imei)}${r.edv?" "+edvChip(r.edv):""}</div>`:""}
  <div class="row sp" style="margin-top:6px"><span class="mut">${dfmt(r.date)}</span><span class="b">${money(r.price)}</span></div></button>`).join(""):`<div class="empty">Henüz cihaz yok. Sağ alttaki + ile ilk cihazı kaydedin.</div>`}`;
}
const IMEI_HINT="IMEI’yi yazın, yapıştırın ya da barkodunu tarayın. Telefondan *#06# tuşlayarak öğrenebilirsiniz.";
function vImei(){
  return `<h1>IMEI sorgulama</h1><div class="card">
  <label for="f_imei" style="margin-top:0">IMEI</label><input id="f_imei" inputmode="numeric" maxlength="17" autocomplete="off" placeholder="15 haneli IMEI">
  <div class="row" style="margin-top:8px"><button class="btn" type="button" data-pasteimei>Yapıştır</button><button class="btn" type="button" data-scan>Barkod tara</button></div>
  <div class="mut" id="imeiMsg" style="margin-top:8px">${IMEI_HINT}</div><div id="edv" aria-live="polite"></div></div>`;
}
function vCash(){
  const tx=db.tx.filter(t=>t.date.startsWith(month)).sort((a,b)=>b.date.localeCompare(a.date));
  const inc=tx.filter(t=>t.type=="in").reduce((a,t)=>a+t.amt,0),exp=tx.filter(t=>t.type=="out").reduce((a,t)=>a+t.amt,0);
  return `<h1>Kasa</h1>${monthBar()}
  <div class="g2" style="margin-bottom:8px"><div class="card" style="margin:0"><div class="mut">Gelir</div><div class="b in">${money(inc)}</div></div><div class="card" style="margin:0"><div class="mut">Gider</div><div class="b out">${money(exp)}</div></div></div>
  ${tx.length?tx.map(t=>`<button class="card item" data-t="${t.id}"><div class="row sp"><span class="b">${esc(t.cat)}</span><span class="b ${t.type}">${t.type=="in"?"+":"−"}${money(t.amt)}</span></div><div class="mut">${dfmt(t.date)}${t.note?" · "+esc(t.note):""}</div></button>`).join(""):`<div class="empty">Bu ay kayıt yok. + ile gelir veya gider ekleyin.</div>`}`;
}
function monthBar(){
  const [y,m]=month.split("-"),n=new Date(y,m-1,1).toLocaleDateString("tr-TR",{month:"long",year:"numeric"});
  return `<div class="row sp" style="margin-bottom:10px"><button class="btn" data-m="-1" aria-label="Önceki ay">‹</button><span class="b">${n}</span><button class="btn" data-m="1" aria-label="Sonraki ay">›</button></div>`;
}
function vSum(){
  const tx=db.tx.filter(t=>t.date.startsWith(month));
  const inc=tx.filter(t=>t.type=="in").reduce((a,t)=>a+t.amt,0),exp=tx.filter(t=>t.type=="out").reduce((a,t)=>a+t.amt,0);
  const open=db.repairs.filter(r=>r.st<3),owed=open.reduce((a,r)=>a+(+r.price||0),0);
  const cats={};tx.filter(t=>t.type=="out").forEach(t=>cats[t.cat]=(cats[t.cat]||0)+t.amt);
  return `<h1>Özet</h1>${monthBar()}
  <div class="card"><div class="mut">Net kâr</div><div class="big ${inc-exp>=0?"in":"out"}">${money(inc-exp)}</div><div class="mut">Gelir ${money(inc)} − Gider ${money(exp)}</div></div>
  <div class="card"><div class="mut">Açık işler</div><div class="big">${open.length} cihaz</div><div class="mut">Teslimde beklenen tahsilat: ${money(owed)}</div>
  <div style="margin-top:8px">${ST.slice(0,3).map((s,i)=>`<span class="chip s${i}" style="margin:0 6px 6px 0">${s}: ${db.repairs.filter(r=>r.st==i).length}</span>`).join("")}</div></div>
  <div class="card"><div class="b" style="margin-bottom:6px">Gider dağılımı</div>${Object.keys(cats).length?Object.entries(cats).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="row sp"><span>${esc(k)}</span><span class="out">${money(v)}</span></div>`).join(""):`<div class="mut">Bu ay gider yok.</div>`}</div>`;
}
// ---- Sol üstteki seçenekler menüsü (soldan açılır) ----
function openMenu(){$("#drawer").classList.add("open");$("#drawerbg").classList.add("open");$("#drawer").setAttribute("aria-hidden","false");$("#menuBtn").setAttribute("aria-expanded","true");setTimeout(()=>$("#drawer [data-v].on,#drawer [data-v]")?.focus(),50)}
function closeMenu(){const o=$("#drawer").classList.contains("open");$("#drawer").classList.remove("open");$("#drawerbg").classList.remove("open");$("#drawer").setAttribute("aria-hidden","true");$("#menuBtn").setAttribute("aria-expanded","false");return o}
function sheet(html){
  closeSheet();const d=document.createElement("div");d.className="sheetbg";d.id="sh";
  d.innerHTML=`<div class="sheet" role="dialog" aria-modal="true"><button class="sheetx" data-close aria-label="Kapat">×</button>${html}</div>`;
  d.addEventListener("click",e=>{if(e.target==d)closeSheet()});document.body.appendChild(d);swipeClose(d);
}
// Ekranı en üstteyken aşağı doğru kaydırınca kapat
function swipeClose(bg){
  const sh=bg.querySelector(".sheet");let y0=null,dy=0,drag=false;
  const reset=()=>{sh.style.transition="transform .2s ease";sh.style.transform="";bg.style.background="";drag=false;y0=null};
  sh.addEventListener("touchstart",e=>{y0=e.touches.length==1&&!e.target.closest("input,textarea,select,[contenteditable]")?e.touches[0].clientY:null;dy=0;drag=false},{passive:true});
  sh.addEventListener("touchmove",e=>{
    if(y0==null)return;const d=e.touches[0].clientY-y0;
    if(!drag){if(d>8&&sh.scrollTop<=0)drag=true;else{if(Math.abs(d)>8)y0=null;return}}
    dy=Math.max(0,d);sh.style.transition="none";sh.style.transform=`translateY(${dy}px)`;
    bg.style.background=`rgba(0,0,0,${(.45*Math.max(0,1-dy/500)).toFixed(3)})`;e.preventDefault();
  },{passive:false});
  sh.addEventListener("touchend",()=>{
    if(!drag){y0=null;return}
    if(dy>Math.min(120,sh.offsetHeight*.25)){sh.style.transition="transform .18s ease";sh.style.transform="translateY(100%)";setTimeout(closeSheet,170)}else reset();
  });
  sh.addEventListener("touchcancel",()=>{if(drag)reset()});
}
function closeSheet(){const s=$("#sh");if(s)s.remove()}
const val=id=>$("#"+id).value.trim();

function repairForm(id){
  const r=db.repairs.find(x=>x.id==id)||{};autoModel="";curEdv=r.edv||null;edvFor=r.edv?r.imei:"";edvState=null;lastTac="";tacIndex();
  sheet(`<h1>${id?"Cihaz detayı":"Yeni cihaz"}</h1>
  <label for="f_name">Müşteri adı <span class="req">*</span></label><input id="f_name" required autocomplete="off" value="${esc(r.name)}">
  <label for="f_phone">Telefon numarası <span class="req">*</span></label><input id="f_phone" required type="tel" inputmode="tel" value="${esc(fmtPhone(r.phone))}" placeholder="0532 123 45 67">
  <label for="f_model">Cihaz (marka / model) <span class="req">*</span></label><input id="f_model" required value="${esc(r.model)}" placeholder="Örn. Samsung A54">
  <label>IMEI</label><input id="f_imei" inputmode="numeric" maxlength="17" autocomplete="off" value="${esc(r.imei)}" placeholder="15 haneli IMEI"><div class="row" style="margin-top:8px"><button class="btn" type="button" data-pasteimei>Yapıştır</button><button class="btn" type="button" data-scan>Barkod tara</button></div><div class="mut" id="imeiMsg">IMEI’yi öğrenmek için telefondan *#06# tuşlayın.</div><div id="edv" aria-live="polite">${edvHtml(r.edv)}</div>
  <label>Arıza / yapılacak iş</label><textarea id="f_issue" rows="2">${esc(r.issue)}</textarea>
  <div class="g2"><div><label>Ücret (₺)</label><input id="f_price" type="number" inputmode="decimal" value="${r.price??""}"></div><div><label>Parça maliyeti (₺)</label><input id="f_cost" type="number" inputmode="decimal" value="${r.cost??""}"></div></div>
  <label>Parçanın alındığı toptancı</label><input id="f_sup" list="suplist" value="${esc(r.sup)}" placeholder="Örn. Ahmet Telekom"><datalist id="suplist">${[...new Set(db.repairs.map(x=>x.sup).filter(Boolean))].map(s=>`<option value="${esc(s)}">`).join("")}</datalist>
  <label>Durum</label><select id="f_st">${ST.map((s,i)=>`<option value="${i}" ${(r.st??0)==i?"selected":""}>${s}</option>`).join("")}</select>
  <div class="row" style="margin-top:16px;flex-wrap:wrap"><button class="btn p" data-save-r="${id||""}">Kaydet</button>
  ${id&&r.st<3?`<button class="btn" data-deliver="${id}">Teslim et ve tahsil et</button>`:""}
  ${id&&r.phone?`<a class="btn" href="tel:${esc(r.phone.replace(/[^\d+]/g,""))}">Ara</a>`:""}
  ${id?`<button class="btn d" data-del-r="${id}">Sil</button>`:""}</div>`);
}
function txForm(id){
  const t=db.tx.find(x=>x.id==id)||{type:"in",date:today()};
  sheet(`<h1>${id?"Kaydı düzenle":"Yeni kayıt"}</h1>
  <div class="tabs"><button class="${t.type=="in"?"on":""}" data-tt="in">Gelir</button><button class="${t.type=="out"?"on":""}" data-tt="out">Gider</button></div>

    if(o.imei.length>=8&&o.model){db.tac=db.tac||{};db.tac[o.imei.slice(0,8)]=o.model}
    if(d.saveR){Object.assign(db.repairs.find(x=>x.id==d.saveR),o)}else db.repairs.push({id:uid(),date:today(),...o});

$("#drawerbg").addEventListener("click",closeMenu);
// Sol kenardan sağa kaydırınca menüyü aç; açıkken sola kaydırınca kapat
(function(){
  const dr=$("#drawer"),bg=$("#drawerbg");let x0=null,y0=0,dx=0,drag=false,w=0;
  const clear=()=>{for(const el of [dr,bg])el.style.transition=el.style.transform=el.style.visibility=el.style.opacity=el.style.pointerEvents="";drag=false;x0=null};
  document.addEventListener("touchstart",e=>{
    x0=null;if(e.touches.length!=1||$("#sh")||$("#scan"))return;
    const t=e.touches[0];if(!dr.classList.contains("open")&&t.clientX>28)return;
    x0=t.clientX;y0=t.clientY;dx=0;drag=false;w=dr.offsetWidth;
  },{passive:true});
  document.addEventListener("touchmove",e=>{
    if(x0==null)return;const t=e.touches[0],ddx=t.clientX-x0,ddy=t.clientY-y0,open=dr.classList.contains("open");
    if(!drag){
      if(Math.abs(ddx)<8&&Math.abs(ddy)<8)return;
      if(Math.abs(ddy)>Math.abs(ddx)||(open?ddx>0:ddx<0)){x0=null;return}
      drag=true;dr.style.transition=bg.style.transition="none";dr.style.visibility="visible";bg.style.pointerEvents="none";
    }
    dx=ddx;const pos=Math.min(0,open?dx:dx-w);
    dr.style.transform=`translateX(${pos}px)`;bg.style.opacity=String(Math.max(0,1+pos/w));e.preventDefault();
  },{passive:false});
  document.addEventListener("touchend",()=>{
    if(x0==null||!drag){x0=null;return}
    const open=dr.classList.contains("open"),go=open?dx<-60:dx>60;clear();
    if(go)open?closeMenu():openMenu();
  });
  document.addEventListener("touchcancel",()=>{if(drag)clear()});
})();

let theme="auto";try{theme=localStorage.getItem("tamir-tema")||"auto"}catch(e){}
// Sağ üstteki güneş/ay düğmeleri: seçilene kadar telefonun ayarı takip edilir, seçilen düğme vurgulanır.
const effTheme=()=>theme=="auto"?(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"):theme;
function applyTheme(){const r=document.documentElement;theme=="auto"?r.removeAttribute("data-theme"):r.setAttribute("data-theme",theme);
  const e=effTheme();document.querySelectorAll(".themesw [data-themeset]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.themeset==e))}
try{matchMedia("(prefers-color-scheme: dark)").addEventListener("change",applyTheme)}catch(e){}

// ---- IMEI -> marka/model otomatik doldurma ----
// IMEI'nin ilk 8 hanesi (TAC) cihaz modelini belirtir. Sıra: 1) bu dükkanda daha önce
// kaydedilen modeller (db.tac), 2) tac/ klasöründeki çevrimdışı veritabanı (~275 bin TAC).
const TAC_SRC=["tac/","https://cdn.jsdelivr.net/gh/ulgen00/Tamir-takip@main/tac/"];
let tacIdx=null,tacBase=null,autoModel="";const tacShards={};
async function tacIndex(){
  if(tacIdx)return tacIdx;
  for(const b of TAC_SRC){try{const r=await fetch(b+"index.json");if(r.ok){const j=await r.json();tacBase=b;return tacIdx={...j,s:new Set(j.s)}}}catch(e){}}
  return null;
}
async function tacLookup(tac){
  const ix=await tacIndex();if(!ix)return undefined; // undefined = veritabanına ulaşılamadı
  const p=tac.slice(0,ix.p);if(!ix.s.has(p))return null;
  if(!tacShards[p]){try{const r=await fetch(tacBase+p+".json");if(!r.ok)return undefined;tacShards[p]=await r.json()}catch(e){return undefined}}
  const sh=tacShards[p],i=sh.t[tac.slice(ix.p)];return i==null?null:sh.m[i];
}
const UPW={LG:1,HTC:1,ZTE:1,TCL:1,HMD:1,OPPO:1,BLU:1,POCO:1,SE:1,XR:1,XS:1,FE:1,GT:1,TV:1,"5G":1,"4G":1,LTE:1,"II":1,"III":1};
const SPW={IPHONE:"iPhone",IPAD:"iPad",IPOD:"iPod",IQOO:"iQOO",ONEPLUS:"OnePlus",REALME:"realme",VIVO:"vivo",HONOR:"HONOR"};
function prettyModel(spec){
  // Kayıtlar "MARKA MODEL, ..." ya da "MARKA, MARKA MODEL" biçiminde: ilk parça tek kelimeyse (sadece marka) modeli sonraki parçadan al
  const p=spec.split(",").map(s=>s.trim()).filter(s=>s&&s!="N/A");let n=p[0]||spec.trim();
  if(n.split(/\s+/).length<2&&p[1]&&!/^\d{4}$/.test(p[1]))n=p[1].toUpperCase().startsWith(n.toUpperCase())?p[1]:n+" "+p[1];
  return n.split(/\s+/).map(w=>{const u=w.toUpperCase();
    if(SPW[u])return SPW[u];if(UPW[u]||/\d/.test(w))return u;return u.charAt(0)+u.slice(1).toLowerCase()}).join(" ");
}
async function fillTac(c){
  const tac=c.slice(0,8),msg=$("#imeiMsg"),f=$("#f_model"),solo=!f;if(!msg)return; // solo: IMEI sorgulama ekranı (model alanı yok)
  const canFill=()=>{if(solo)return true;const v=f.value.trim();return !v||v==autoModel};
  const learned=db.tac&&db.tac[tac];
  let m=learned,spec="";
  if(!m){
    if(canFill())msg.textContent="IMEI’den marka/model aranıyor…";
    spec=await tacLookup(tac);
    if($("#f_imei")?.value.replace(/\D/g,"").slice(0,8)!==tac)return; // bu arada IMEI değişti
    if(spec===undefined){msg.textContent="Model veritabanına ulaşılamadı (internet bağlantısını kontrol edin). Marka/modeli elle yazın.";return}
    if(spec===null){if(solo){msg.textContent="Bu IMEI model veritabanında bulunamadı.";return}if(autoModel&&f.value.trim()==autoModel){f.value="";autoModel=""}msg.textContent="Bu IMEI model veritabanında bulunamadı. Marka/modeli elle yazın; bir sonraki sefer otomatik dolar.";return}
    m=prettyModel(spec);
  }
  const ok=c.length<15||luhn(c);
  if(solo)msg.textContent="Marka/model: "+m+(spec?" ("+spec+")":" (önceki kayıtlarınızdan)")+".";
  else if(canFill()){f.value=m;autoModel=m;msg.textContent="Marka/model otomatik dolduruldu: "+m+(spec?" ("+spec+")":" (önceki kayıtlarınızdan)")+"."}
  else msg.textContent="Bu IMEI için bulunan model: "+m+(spec?" ("+spec+")":"")+". Alan dolu olduğu için değiştirilmedi.";
  if(!ok)msg.textContent+=" Uyarı: IMEI doğrulama hanesi uyuşmuyor, kontrol edin.";
}
let lastTac="";
// Telefon numarası: yazmaya başlarken başına 0 gelir (+90 ile yazılırsa dokunulmaz)
document.addEventListener("focusin",e=>{const t=e.target;if(t.id=="f_phone"&&!t.value){t.value="0";t.setSelectionRange(1,1)}});
document.addEventListener("focusout",e=>{const t=e.target;if(t.id=="f_phone"&&t.value.trim()=="0")t.value=""});
// 0532 123 45 67 biçimi (+90 ile yazılırsa +90 532 123 45 67)
function fmtPhone(v){
  v=String(v||"");let d=v.replace(/\D/g,"");
  if(v.trim().startsWith("+")){if(!d.startsWith("90"))return v;d=d.slice(2,12);return "+90"+[d.slice(0,3),d.slice(3,6),d.slice(6,8),d.slice(8,10)].filter(Boolean).map(x=>" "+x).join("")}
  d=d.slice(0,11);return [d.slice(0,4),d.slice(4,7),d.slice(7,9),d.slice(9,11)].filter(Boolean).join(" ");
}
document.addEventListener("input",e=>{
  const t=e.target;if(t.id!="f_phone")return;
  let v=t.value,pos=t.selectionStart??v.length;const prev=t._prev||"";
  // Sadece bir boşluk silindiyse, önündeki rakamı da sil (yoksa silme tuşu takılı kalır)
  if(e.inputType=="deleteContentBackward"&&v.replace(/\D/g,"")==prev.replace(/\D/g,"")&&pos>0){v=v.slice(0,pos-1)+v.slice(pos);pos--}
  if(v&&!/^[0+]/.test(v)){v="0"+v;pos++}
  const keep=v.slice(0,pos).replace(/\s/g,"").length,f=fmtPhone(v);
  let i=0,n=0;while(i<f.length&&n<keep){if(f[i]!=" ")n++;i++}
  t.value=f;t._prev=f;try{t.setSelectionRange(i,i)}catch(e){}
});
document.addEventListener("input",e=>{if(e.target.id=="f_imei"){const v=e.target.value.replace(/\D/g,"");
  if(v.length>=8&&(v.slice(0,8)!=lastTac||v.length==15)){lastTac=v.slice(0,8);fillTac(v)}else if(v.length<8){lastTac="";if(!$("#f_model")&&$("#imeiMsg"))$("#imeiMsg").textContent=IMEI_HINT}
  edvImeiChanged(v)}});
document.addEventListener("keydown",e=>{if(e.target.id=="f_edvcode"&&e.key=="Enter"){e.preventDefault();edvSend()}});
// ---- e-Devlet IMEI kayıt sorgusu ----
// Sorgu, worker/imei-worker.js ile kurulan Cloudflare Worker üzerinden yapılır (tarayıcı
// e-Devlet'e doğrudan bağlanamaz). Adres boşsa bu özellik gizlenir.
const EDV_API="https://cep-atolyesi-imei.hvt8b9y5zt.workers.dev";
let curEdv=null,edvFor="",edvState=null;
const EDV_L={kayitli:["Kayıtlı","s2"],kayitsiz:["Kayıtsız","s4"],kapali:["Kapalı","s4"],bilinmiyor:["Durum","s3"]};
const edvChip=e=>e&&EDV_L[e.sinif]?`<span class="chip ${EDV_L[e.sinif][1]}">${EDV_L[e.sinif][0]}</span>`:"";
function edvHtml(e){
  if(!e)return "";
  return `<div class="card" style="margin:8px 0 0"><div class="row sp"><span class="b">e-Devlet IMEI kaydı</span>${edvChip(e)}</div><div class="mut">${esc(e.durum)}</div>${e.kaynak?`<div class="mut">Kaynak: ${esc(e.kaynak)}</div>`:""}${e.model?`<div class="mut">${esc(e.model)}</div>`:""}
  <div class="row sp" style="margin-top:6px"><span class="mut">Sorgu tarihi: ${esc(e.tarih)}</span>${EDV_API?`<button class="btn" type="button" data-edvq>Yenile</button>`:""}</div></div>`;
}
const edvBox=h=>{const b=$("#edv");if(b)b.innerHTML=h};
function edvImeiChanged(v){
  if(curEdv&&curEdv.imei!=v){curEdv=null;edvFor="";edvBox(edvHtml(null))}
  if(EDV_API&&v.length==15&&luhn(v)&&v!=edvFor)edvQuery(v);
}
function edvSend(){const c=$("#f_edvcode")?.value.trim();if(c)edvQuery(edvFor,c)}
async function edvQuery(imei,code){
  if(!EDV_API)return;imei=imei||$("#f_imei").value.replace(/\D/g,"");
  if(imei.length!=15){edvBox(`<div class="mut" style="margin-top:8px">e-Devlet sorgusu için 15 haneli IMEI gerekli.</div>`);return}
  edvFor=imei;edvBox(`<div class="mut" style="margin-top:8px">e-Devlet’te sorgulanıyor…</div>`);
  let j;
  try{const r=await fetch(EDV_API.replace(/\/$/,"")+"/sorgu",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(code?{imei,state:edvState,code}:{imei})});j=await r.json()}
  catch(e){j={error:"Sorgu sunucusuna ulaşılamadı. İnternet bağlantısını kontrol edin."}}
  if(edvFor!=imei||!$("#edv"))return; // bu arada IMEI değişti ya da form kapandı
  if(j.ok){curEdv={imei,durum:j.durum,sinif:j.sinif,kaynak:j.kaynak,tarih:j.tarih,model:j.model};edvBox(edvHtml(curEdv));return}
  if(j.captcha){
    edvState=j.captcha.state;
    edvBox(`<div class="card" style="margin:8px 0 0"><div class="b">e-Devlet doğrulama kodu istiyor</div>${j.captcha.error?`<div class="out" style="font-size:14px">${esc(j.captcha.error)}</div>`:""}
    <img src="${esc(j.captcha.img)}" alt="Doğrulama kodu resmi" style="display:block;margin:8px 0;max-width:100%;background:#fff;border-radius:8px">
    <div class="row"><input id="f_edvcode" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Resimdeki kodu yazın"><button class="btn p" type="button" data-edvsend>Gönder</button></div></div>`);
    $("#f_edvcode").focus();return;
  }
  edvBox(`<div class="mut" style="margin-top:8px">${esc(j.error||"Sorgu yapılamadı.")} <button class="btn" type="button" data-edvq>Tekrar dene</button></div>`);
}
let stream=null,scanTimer=null;
const luhn=s=>{let t=0;for(let i=0;i<15;i++){let n=+s[14-i];if(i%2){n*=2;if(n>9)n-=9}t+=n}return t%10==0};
// Panodaki metinden IMEI'yi bulup yazar ("IMEI: 35 601506 ..." gibi metinler, çift SIM'de ilk IMEI)
const imeiFrom=t=>setImei(t)||setImei(String(t).replace(/\D/g,""));
async function pasteImei(){
  const msg=$("#imeiMsg");
  try{const t=await navigator.clipboard.readText();if(!imeiFrom(t))msg.textContent="Panoda 15 haneli IMEI bulunamadı. Önce IMEI’yi kopyalayın."}
  catch(e){msg.textContent="Bu tarayıcı panoyu okumaya izin vermedi. IMEI kutusuna basılı tutup Yapıştır’ı seçin."}
}
document.addEventListener("paste",e=>{
  if(e.target.id!="f_imei")return;const t=(e.clipboardData||window.clipboardData)?.getData("text")||"";
  if(imeiFrom(t)){e.preventDefault();return}
  const d=t.replace(/\D/g,"");if(d!==t){e.preventDefault();const i=e.target;i.value=(i.value.slice(0,i.selectionStart)+d+i.value.slice(i.selectionEnd)).slice(0,17);i.dispatchEvent(new Event("input",{bubbles:true}))}
});
function setImei(v){
  const m=String(v).match(/\d{15}/g)||[];const c=m.find(luhn)||m[0];if(!c)return false;
  $("#f_imei").value=c;$("#imeiMsg").textContent=luhn(c)?"IMEI okundu.":"IMEI okundu ancak doğrulama hanesi uyuşmuyor, lütfen kontrol edin.";lastTac=c.slice(0,8);fillTac(c);edvImeiChanged(c);return true;
}
const mkDet=()=>new BarcodeDetector({formats:["code_128","code_39","ean_13","itf","qr_code","data_matrix"]});
async function startScan(){
  const msg=$("#imeiMsg");
  if(!window.BarcodeDetector){msg.textContent="Bu tarayıcı barkod okumayı desteklemiyor. IMEI’yi elle yazın.";return}
  try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}})}
  catch(e){msg.textContent="Kamera açılamadı. Etiketin fotoğrafını çekerek deneyin.";photoScan();return}
  const det=mkDet(),o=document.createElement("div");o.className="scan";o.id="scan";
  o.innerHTML='<video playsinline muted></video><div class="scanhint">Barkodu çerçeveye getirin</div><button class="btn" data-stopscan>Kapat</button>';
  document.body.appendChild(o);const v=o.querySelector("video");v.srcObject=stream;await v.play();
  scanTimer=setInterval(async()=>{try{for(const x of await det.detect(v)){if(setImei(x.rawValue)){stopScan();return}}}catch(e){}},300);
}
function stopScan(){clearInterval(scanTimer);if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;const o=$("#scan");if(o)o.remove()}
function photoScan(){
  const i=document.createElement("input");i.type="file";i.accept="image/*";i.capture="environment";
  i.onchange=async()=>{const f=i.files[0];if(!f)return;try{const r=await mkDet().detect(await createImageBitmap(f));
    if(!r.some(x=>setImei(x.rawValue)))$("#imeiMsg").textContent="Barkod okunamadı. Daha yakından çekin veya IMEI’yi elle yazın."}
    catch(e){$("#imeiMsg").textContent="Fotoğraf okunamadı. IMEI’yi elle yazın."}};
  i.click();
}
render();
</script>
