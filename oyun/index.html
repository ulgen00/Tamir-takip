function build(W, fn) {

    ground(a, z, top) { for (let c = a; c <= z; c++) for (let r = top; r < ROWS; r++) g[r][c] = '#'; },
    water(a, z, top) { for (let c = a; c <= z; c++) for (let r = top; r < ROWS; r++) g[r][c] = '~'; },

    e(type, c, r, o) { E.push(Object.assign({ type, c, r }, o || {})); },

}

}

function update(dt) {

  if (lv) updateAmbient(dt);
  if (fade.dir === 1) return;
  if ((kp.has('Escape') || kp.has('KeyP')) && state === 'play') { setState('pause'); return; }
  switch (state) {
    case 'title': case 'pause': case 'end': menuNav(); if (state === 'pause' && kp.has('Escape')) state = 'play'; break;
    case 'cut': updateCut(dt); break;
    case 'card':
      if (stateT > 3 || (stateT > 0.4 && (tapQueued || confirmKey()))) { setState('play'); if (lv.L.intro) openDialog(lv.L.intro); }
      break;
    case 'play': updatePlay(dt); break;
    case 'dialog': updateDialog(dt); break;
  }
}
function menuNav() {
  if (!uiButtons.length) return;
  if (kp.has('ArrowDown') || kp.has('KeyS')) { menuSel = (menuSel + 1) % uiButtons.length; sfx.ui(); }
  if (kp.has('ArrowUp') || kp.has('KeyW')) { menuSel = (menuSel - 1 + uiButtons.length) % uiButtons.length; sfx.ui(); }
  menuSel = clamp(menuSel, 0, uiButtons.length - 1);

}

  for (const b of uiButtons) if (p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h) { b.action(); return; }
  if (state === 'play' && Math.hypot(p.x - (VW - 30), p.y - 28) < 26) { sfx.ui(); setState('pause'); return; }
  tapQueued = true;
}
function updateDialog(dt) {
  const line = dlg.lines[dlg.i], len = line[1].length;
  const before = Math.floor(dlg.chars);
  dlg.chars = Math.min(len, dlg.chars + dt * 48);
  if (Math.floor(dlg.chars) !== before && Math.floor(dlg.chars) % 3 === 0 && line[1][Math.floor(dlg.chars) - 1] !== ' ') sfx.talk();
  if (tapQueued || confirmKey() || kp.has('ArrowUp') || kp.has('KeyW')) {
    if (dlg.chars < len) dlg.chars = len;
    else if (++dlg.i >= dlg.lines.length) { const cb = dlg.onEnd; dlg = null; state = 'play'; cb && cb(); }
    else dlg.chars = 0;
  }
}
function updateCut(dt) {
  cut.t += dt;
  const sc = cut.scenes[cut.i], len = sc.txt.length;
  cut.chars = Math.min(len, cut.chars + dt * 34);
  if (sc.flash && cut.t < 0.05) { lvFlash = 1; sfx.thunder(); }
  if (tapQueued || confirmKey()) {
    if (cut.chars < len) cut.chars = len;

    else fadeOut(() => cut.onEnd(), 1.6);

}
let lvFlash = 0;
function updateAmbient(dt) {
  lvFlash = Math.max(0, lvFlash - dt * 2.5);

  for (let i = lv.parts.length - 1; i >= 0; i--) { const q = lv.parts[i]; q.life -= dt; if (q.life <= 0) { lv.parts.splice(i, 1); continue; } q.vy += q.grav * dt; q.x += q.vx * dt; q.y += q.vy * dt; }

}
function updatePlay(dt) {
  const p = lv.p, L = lv.L;
  G.time += dt; lv.msgCD -= dt;
  // rüzgâr
  if (L.wind) {
    const w = lv.wind; w.t -= dt;
    if (w.t <= 0) {
      if (w.phase === 'calm') { w.phase = 'warn'; w.t = 0.9; }
      else if (w.phase === 'warn') { w.phase = 'gust'; w.t = 1.7; sfx.gust(); }
      else { w.phase = 'calm'; w.t = 3.5 + Math.random() * 3; }
    }
    w.force = lerp(w.force, w.phase === 'gust' ? -78 : 0, 1 - Math.exp(-5 * dt));
  }
  // ölüm / yeniden doğma
  if (p.dead > 0) {
    p.dead -= dt;
    if (p.dead < 0.5 && !p.respawned) { p.respawned = true; p.x = lv.respawn.x; p.y = lv.respawn.y; p.vx = p.vy = 0; p.face = 1; lv.wind.phase = 'calm'; lv.wind.t = 2.5; lv.wind.force = 0; }

  for (let r = r0; r <= r1; r++) for (let c = c0; c <= c1; c++) {
    const ch = tileAt(c, r);
    if (ch === '^' && overlap(hb, { x: c * T + 4, y: r * T + 16, w: T - 8, h: 16 })) die();

  if (lv.shard && !lv.shardTaken && Math.hypot(pc.x - lv.shard.x, pc.y - lv.shard.y) < 22) {
    lv.shardTaken = true; sfx.shard(); burst(lv.shard.x, lv.shard.y, '#bff3ff', 26, 200, 60); burst(lv.shard.x, lv.shard.y, '#ffe9a8', 16, 140, 60);

  // çıkış

}
function nearestInteract() {

function drawWorld() {
  const cx = Math.round(lv.cam.x), th = lv.th, theme = lv.L.theme;
  if (theme === 'village') bgVillage(cx); else if (theme === 'forest') bgForest(cx); else bgStorm(cx);
  ctx.save(); ctx.translate(-cx, 0);
  const c0 = Math.max(0, Math.floor(cx / T) - 1), c1 = Math.min(lv.W - 1, Math.floor((cx + VW) / T) + 1);
  // fırtına bölümünün sonundaki fener
  if (theme === 'storm') { const lx = 114 * T; if (lx > cx - 200 && lx < cx + VW + 200) lighthouse(lx, 10 * T, 1.75, false, GT); }
  // platformların arka plan parçaları (evler, gövdeler)
  for (let r = 0; r < ROWS; r++) {
    let c = c0 - 8;
    while (c <= c1 + 1) {
      if (c < 0 || lv.g[r][c] !== '=' || (c > 0 && lv.g[r][c - 1] === '=')) { c++; continue; }
      let e = c; while (e + 1 < lv.W && lv.g[r][e + 1] === '=') e++;
      drawPlatformBack(c, e, r, theme);
      c = e + 1;
    }
  }
  if (theme === 'forest') fireflies(cx);
  // kareler
  for (let r = 0; r < ROWS; r++) for (let c = c0; c <= c1; c++) {
    const ch = lv.g[r][c]; if (ch === '.') continue;
    const x = c * T, y = r * T;
    if (ch === '#') {
      ctx.fillStyle = th.fill; ctx.fillRect(x, y, T, T);
      ctx.fillStyle = th.fill2;
      if (hash(c, r) < 0.7) ctx.fillRect(x + hash(r, c) * 22 + 2, y + hash(c + 7, r) * 20 + 8, 6, 3);
      if (hash(c, r + 9) < 0.5) ctx.fillRect(x + hash(r + 3, c) * 24, y + hash(c, r + 4) * 22 + 6, 3, 3);
      const above = tileAt(c, r - 1);
      if (!isSolid(above) && above !== '^') {
        ctx.fillStyle = th.top; ctx.fillRect(x, y, T, 7);
        ctx.fillStyle = th.top2; for (let k = 0; k < 4; k++) ctx.fillRect(x + k * 8 + 2, y + 7, 4, 2 + (hash(c, k) * 3 | 0));
        ctx.fillStyle = th.top; for (let k = 0; k < 4; k++) if (hash(c * 4 + k, r) > 0.45) ctx.fillRect(x + k * 8 + 3, y - 3, 2, 3);
        if (theme === 'village' && hash(c, 99) > 0.8) { ctx.fillStyle = ['#f2d14e', '#f07b9a', '#fff'][c % 3]; ctx.fillRect(x + 14, y - 4, 3, 3); }
      }
      if (!isSolid(tileAt(c - 1, r)) && c > 0) { ctx.fillStyle = 'rgba(0,0,0,0.15)'; ctx.fillRect(x, y, 3, T); }
      if (!isSolid(tileAt(c + 1, r)) && c < lv.W - 1) { ctx.fillStyle = 'rgba(0,0,0,0.15)'; ctx.fillRect(x + T - 3, y, 3, T); }
    } else if (ch === 'B') {
      ctx.fillStyle = '#8a5a2f'; ctx.fillRect(x + 1, y + 1, T - 2, T - 2);
      ctx.strokeStyle = '#5a3a1c'; ctx.lineWidth = 2; ctx.strokeRect(x + 2, y + 2, T - 4, T - 4);
      ctx.beginPath(); ctx.moveTo(x + 3, y + 3); ctx.lineTo(x + T - 3, y + T - 3); ctx.moveTo(x + T - 3, y + 3); ctx.lineTo(x + 3, y + T - 3); ctx.stroke();
    } else if (ch === '=') drawPlatformTop(c, r, theme);
    else if (ch === '^') {
      ctx.fillStyle = th.spike;
      for (let k = 0; k < 4; k++) { ctx.beginPath(); ctx.moveTo(x + k * 8, y + T); ctx.lineTo(x + k * 8 + 4, y + 14 + (k % 2) * 3); ctx.lineTo(x + k * 8 + 8, y + T); ctx.fill(); }
      ctx.fillStyle = 'rgba(255,255,255,0.25)'; for (let k = 0; k < 4; k++) ctx.fillRect(x + k * 8 + 3.5, y + 17 + (k % 2) * 3, 1, 6);
    } else if (ch === '~') {
      const top = tileAt(c, r - 1) !== '~';
      ctx.fillStyle = 'rgba(40,90,160,0.85)'; ctx.fillRect(x, y + (top ? 10 : 0), T, top ? T - 10 : T);
      if (top) { ctx.fillStyle = 'rgba(170,210,255,0.7)'; for (let k = 0; k < 4; k++) ctx.fillRect(x + k * 8, y + 9 + Math.sin(GT * 3 + c + k) * 1.5, 6, 2); }
    }
  }
  drawEntities();
  ctx.restore();
  // sis / ışık katmanları
  if (theme === 'forest') { const g = ctx.createLinearGradient(0, 0, 0, VH); g.addColorStop(0, 'rgba(10,20,45,0)'); g.addColorStop(1, 'rgba(10,20,45,0.35)'); ctx.fillStyle = g; ctx.fillRect(0, 0, VW, VH); }
  if (theme === 'storm') { rain(lv.wind.force); windStreaks(); }
  if (theme === 'village') { ctx.fillStyle = 'rgba(255,140,80,0.06)'; ctx.fillRect(0, 0, VW, VH); }
  if (lvFlash > 0) { ctx.fillStyle = `rgba(225,232,255,${lvFlash * 0.55})`; ctx.fillRect(0, 0, VW, VH); }
  const p = lv.p;
  if (p.dead > 0) { ctx.fillStyle = `rgba(0,0,0,${clamp(1 - Math.abs(p.dead - 0.5) * 2.2, 0, 1)})`; ctx.fillRect(0, 0, VW, VH); }
}
function windStreaks() {

  ctx.strokeStyle = `rgba(220,230,245,${0.35 * f})`; ctx.lineWidth = 1.5; ctx.beginPath();
  for (let i = 0; i < 18; i++) { const y = hash(i, 31) * VH * 0.85; const x = VW - ((GT * 900 + hash(i, 32) * 2000) % (VW + 300)); ctx.moveTo(x, y); ctx.lineTo(x + 40 + hash(i, 2) * 40, y + 2); }

}
function fireflies(cx) {
  for (let i = 0; i < 46; i++) {
    const bx = hash(i, 7) * lv.W * T, by = 70 + hash(i, 8) * 240;
    const x = bx + Math.sin(GT * 0.7 + i) * 26, y = by + Math.sin(GT * 1.1 + i * 2) * 14;
    if (x < cx - 20 || x > cx + VW + 20) continue;

function drawPlatformBack(c, e, r, theme) {

  button('Devam', x, 130, 210, 40, () => { sfx.ui(); state = 'play'; });
  button('Bölümü Baştan Başla', x, 180, 210, 40, () => { G.pearls = lv.startPearls; fadeOut(() => startChapter(lv.i)); });
  button('Ses: ' + (Snd.on ? 'Açık' : 'Kapalı'), x, 230, 210, 40, () => { setSound(!Snd.on); sfx.ui(); });
  button('Ana Menü', x, 280, 210, 40, toTitle);
}
function drawEnd() {
  drawSeaScene({ lit: true, dawn: true, boat: null }, GT);
  ctx.fillStyle = 'rgba(5,8,18,0.45)'; ctx.fillRect(0, 0, VW, VH);
  text('SON', VW / 2, 70, 46, '#f6e7bf');
  text('Martı Adası\'nın feneri yeniden yanıyor.', VW / 2, 110, 16, '#e8dcc0', 'center', '500');
  const m = Math.floor(G.time / 60), s = Math.floor(G.time % 60);
  text('Süre: ' + m + ':' + String(s).padStart(2, '0') + '    ·    Düşüş: ' + G.deaths + '    ·    İnci: ' + G.pearls + ' / ' + PEARL_TOTAL, VW / 2, 150, 15, '#f3e6c4', 'center', '600');
  if (G.pearls >= PEARL_TOTAL) text('Bütün incileri topladın!', VW / 2, 176, 14, '#bff3ff', 'center', '600');
  button('Ana Menü', VW / 2 - 90, 210, 180, 40, () => { fadeOut(() => { setState('title'); setMusic('title'); lv = null; }); });
}

function render() {
  ctx.setTransform(SCALE, 0, 0, SCALE, 0, 0);
  uiButtons = [];
  switch (state) {
    case 'title': drawTitle(); break;
    case 'cut': drawCut(); break;
    case 'card': drawCard(); break;
    case 'play': case 'dialog': case 'pause':
      drawWorld(); drawHUD();
      if (state === 'dialog' && dlg) drawDialog();
      if (state === 'play') drawTouch();
      if (state === 'pause') drawPause();
      break;
    case 'end': drawEnd(); break;
  }
  if (fade.a > 0) { ctx.fillStyle = `rgba(0,0,0,${fade.a})`; ctx.fillRect(0, 0, VW, VH); }
}

// otomatik duraklatma
const portrait = matchMedia('(orientation: portrait)');
document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'play') setState('pause'); });

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.033, (now - last) / 1000); last = now; GT += dt;
  if (portrait.matches && state === 'play') setState('pause');
  readInput(); update(dt); render();
  kp.clear(); tapQueued = false;
  requestAnimationFrame(frame);
}
setMusic('title');
requestAnimationFrame(frame);
window.__oyun = { get lv() { return lv; }, get state() { return state; }, startChapter, G: () => G };
</script>
